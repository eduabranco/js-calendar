<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="template" class="calendar"> 
    <h2>カレンダーテ  ンプレート</h2>
    <table >
      <caption><span class="month">9</span>月のカレンダー</caption>
      <thead>
        <tr>
          <th class="day sun">日</th>
          <th class="day mon">月</th>
          <th class="day tue">火</th>
          <th class="day wed">水</th>
          <th class="day thu">木</th>
          <th class="day fri">金</th>
          <th class="day sat">土</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <td colspan="7">ここはtfootです&lt; &gt;Jhon&nbsp;Doe</td>
        </tr>
      </tfoot>
      <tbody>
        <tr>
          <td class="day sun">&nbsp;</td>
          <td class="day"> &nbsp;</td>
          <td class="day">1</td>
          <td class="day">2</td>
          <td class="day">3</td>
          <td class="day">4</td>
          <td class="day sat">5</td>
        </tr>
        <tr>
          <td class="day sun">6</td>
          <td class="day today">7</td>
          <td class="day">8</td>
          <td class="day">9</td>
          <td class="day">10</td>
          <td class="day">11</td>
          <td class="day sat">12</td>
        </tr>
      </tbody>
    </table>
  </section>
  <div id="template">
    <template id="cal_body" class="calendar">
      <h2 class="title"></h2>
      <table >
      <caption><span class="month">9</span>月のカレンダー</caption>
      <thead>
        <tr>
          <th class="day sun">日</th>
          <th class="day mon">月</th>
          <th class="day tue">火</th>
          <th class="day wed">水</th>
          <th class="day thu">木</th>
          <th class="day fri">金</th>
          <th class="day sat">土</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <td colspan="7" class="remark"></td>
        </tr>
      </tfoot>
      <tbody></tbody>
    </table>
    </template>
    <template id="cal_row">
        <tr>
          <td class="day sun"><span></span></td>
          <td class="day today"><span></span></td>
          <td class="day"><span></span></td>
          <td class="day"><span></span></td>
          <td class="day"><span></span></td>
          <td class="day"><span></span></td>
          <td class="day sat"><span></span></td>
        </tr>
    </template>
  </div>
  <section id="actual"></section> 
  <script src="Calendar.js"></script>
  <script>
    const cal = new Calendar('actual');
  </script>
</body>
</html>
