<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <section id="template" class="Calendar"> 
    <h2>カレンダーテンプレート</h2>
    <table>
      <caption><span class="month">9</span>月のカレンダー</caption>
      <thead>
        <tr>
          <th class="day sun">日</th>
          <th class="day mon">月</th>
          <th class="day tue">火</th>
          <th class="day wed">水</th>
          <th class="day thu">木</th>
          <th class="day fri">金</th>
          <th class="day sat">土</th>
        </tr>
      </thead>
      <tfoot></tfoot>
      <tbody>
      </tbody>
    </table>
  </section>
  
  <p>現在の日付: <span id="currentDate"></span></p>
  <script src="Calendar.js"></script>
</body>
</html>
